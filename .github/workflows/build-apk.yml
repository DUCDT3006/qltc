name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v2.0.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v2.0.1.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.1
          name: "QLTC v2.0.1 - Sửa Lỗi Khởi Động WebView & Bảo Vệ Khởi Chạy Ứng Dụng Android"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v2.0.1 - Android APK

            Bản vá nóng v2.0.1 sửa triệt để lỗi không mở được app trên Android:
            - **Bảo vệ khởi chạy an toàn (Non-blocking Init):** Chuyển toàn bộ khởi tạo WorkManager và mã hóa thiết bị vào luồng nền độc lập, đảm bảo UI WebView luôn mở tức thì và không bị dừng đột ngột.
            - **Khôi phục WebViewClient tương thích cao:** Cho phép nạp toàn diện tài nguyên ứng dụng mượt mà, hỗ trợ tải file APK qua trình duyệt máy.
            - **Cấu hình WorkManager Public:** Đảm bảo WorkManager framework khởi tạo chính xác các tác vụ đồng bộ nền trên mọi dòng máy (Samsung, Xiaomi, Oppo...).
          files: |
            qltc-v2.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
