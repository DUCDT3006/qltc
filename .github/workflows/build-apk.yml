name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.2.5.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.2.5.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.5
          name: "QLTC v1.2.5 - Quản Lý Đầy Đủ Thông Tin Ngân Hàng, VietQR & Sao Chép STK Nhanh"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v1.2.5 - Android APK

            Phiên bản `v1.2.5` nâng cấp toàn diện tính năng Quản lý Tài khoản & Ví ngân hàng:
            - **Thông tin ngân hàng đầy đủ:** Thiết lập đầy đủ Tên chủ tài khoản, Số tài khoản ngân hàng, Chi nhánh, Tên ví gợi nhớ và Số dư thực tế.
            - **Danh mục 76+ Ngân hàng Việt Nam chuẩn VietQR / Napas:** Tích hợp bộ chọn ngân hàng nhanh với tìm kiếm thông minh bằng chữ cái đầu (vcb, tcb, mb, hd, bidv...) hoặc tên đầy đủ, hiển thị logo chính hãng.
            - **Tự động tạo mã QR chuyển khoản (VietQR / Napas 247):** Chạm vào nút "Mã QR" để xem và tải ảnh QR chuẩn ngân hàng, có tùy chọn nhập số tiền và lời nhắn chuyển khoản.
            - **Sao chép tài khoản 1 chạm:** Nút "Sao chép STK" tiện lợi để gửi nhanh thông tin tài khoản qua Zalo, Messenger, SMS.
            - **Chỉnh sửa linh hoạt:** Hỗ trợ xem và sửa lại toàn bộ thông tin tài khoản bất cứ lúc nào.
          files: |
            qltc-v1.2.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
