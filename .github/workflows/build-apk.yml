name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk qltc-v2.0.5.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v2.0.5.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.5
          name: "QLTC v2.0.5 - Rung phản hồi gạt bỏ qua & duyệt mượt hơn"
          draft: false
          prerelease: false
          body: |
            ## QLTC v2.0.5 cho Android

            - Thêm phản hồi rung nhẹ native (`VIBRATE` + `AndroidBridge.triggerLightHaptic`) khi gạt trái bỏ qua thông báo.
            - Tinh chỉnh chuyển thẻ duyệt/từ chối giao dịch tức thì, mượt hơn.
            - Cải thiện chọn khoản vay thu nợ, lọc tin nhắn quảng cáo nhà mạng và xử lý hết phiên đăng nhập.
          files: |
            qltc-v2.0.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
