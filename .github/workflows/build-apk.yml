name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.1.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "QLTC v1.1.0 - Kế hoạch Thu Chi Dự Kiến vs Thực Tế, Thống kê Tháng/Quý/Năm & Tự động lấy giá Fmarket"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v1.1.0 - Android APK

            Bản nâng cấp lớn `v1.1.0` bổ sung hệ thống quản trị Thu Chi Dự Kiến vs Thực Tế & Tài sản thực tế tích hợp Fmarket API:
            - **Thu Chi Dự Kiến & Thực Tế:**
              - **Dự kiến:** Nhập các khoản thu dự kiến, khoản chi dự kiến và thiết lập tỷ lệ `%` cho các hũ (tự động kiểm tra & cân bằng tổng `%` các hũ = 100%).
              - **Thực tế:** Tự động tổng hợp từ các giao dịch đã duyệt thực tế và tự động tính cơ cấu `%` thực tế của từng hũ (tổng `%` thực tế = 100%).
            - **Thống kê 6 lớp Tài sản thực tế & Tích hợp Fmarket API:**
              - Thống kê chi tiết: Tài khoản ngân hàng, Tiền mặt, Tài sản tài chính (Quỹ mở Fmarket, Cổ phiếu, Crypto), Vàng, Bạc, Đất/BĐS.
              - Kết nối trực tiếp **Fmarket API** để chọn nhanh hơn 70 quỹ mở trên Fmarket (`VESAF`, `DCDS`, `VCBF-BCF`, `SSISCA`...) và tự động cập nhật giá NAV theo ngày cùng giá Vàng, Bạc, Crypto.
            - **So sánh Thực tế vs Dự kiến theo Tháng / Quý / Năm:**
              - So sánh nguồn thu thực tế đạt bao nhiêu `%` so với dự kiến (tổng và từng nguồn thu).
              - So sánh các hũ thực tế đạt bao nhiêu `%` so với hạn mức dự kiến và đối chiếu tỷ trọng `%` thực tế vs `%` dự kiến theo Tháng, Quý, Năm.
          files: |
            qltc-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
