name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.2.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.2.3.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.3
          name: "QLTC v1.2.3 - Xem Chi Tiết Khoản Thu Chi Khi Chạm Vào Hũ"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v1.2.3 - Android APK

            Phiên bản `v1.2.3` bổ sung tính năng xem chi tiết thu chi theo từng hũ:
            - **Chi tiết thu chi từng hũ:** Chạm vào bất kỳ hũ nào (ở cả màn hình Ngân sách và Tổng quan) để xem ngay danh sách các khoản thu chi thực tế đã ghi nhận của hũ đó, tổng chi tiêu, hạn mức, số tiền còn lại và tỷ lệ đã dùng.
            - **Bộ lọc linh hoạt:** Xem nhanh các giao dịch theo tháng này hoặc tất cả thời gian.
            - **Tích hợp liền mạch:** Hỗ trợ nút ghi nhanh chi tiêu hoặc mở chỉnh sửa cấu hình hũ ngay trong modal chi tiết.
          files: |
            qltc-v1.2.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
