name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.0.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.0.2.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: "QLTC v1.0.2 - Nâng cấp bộ tải APK trực tiếp & Cập nhật hũ thu chi"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v1.0.2 - Android APK

            Bản cập nhật v1.0.2 bổ sung các cải tiến quan trọng:
            - **Trình tải file APK trực tiếp:** Tự động kích hoạt tải xuống khi bấm nút cập nhật trong app.
            - **Hộp thoại Reset trực tiếp:** Xóa giao dịch, số dư và danh mục đầu tư về 0đ an toàn và nhanh chóng.
            - **Linh hoạt chọn hũ:** Khoản chi chọn toàn bộ 6 hũ chi tiêu; khoản thu chọn nguồn thu nhập.
            - **Bóc tách ngân hàng chuẩn xác:** Hỗ trợ đầy đủ Techcombank, HDBank, SMS (Samsung, Xiaomi) & các ví điện tử.
          files: |
            qltc-v1.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
