name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.0.6.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.0.6.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.6
          name: "QLTC v1.0.6 - Tự động ghép cặp chuyển tiền nội bộ & Nút tách giao dịch thông minh"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v1.0.6 - Android APK

            Bản cập nhật v1.0.6 nâng cấp toàn diện hệ thống xử lý dòng tiền nội bộ:
            - **Tự động ghép cặp chuyển khoản nội bộ (Auto-pairing):** Kết hợp Phương án 1 (thời gian/số tiền đối ứng) và Phương án 3 (từ khóa nội dung) để tự động nhận diện tiền chuyển giữa các tài khoản của bạn.
            - **Triệt tiêu trùng lặp thu/chi:** Tiền chuyển giữa các tài khoản không bị tính nhân đôi thành 1 khoản Thu và 1 khoản Chi, bảo toàn chính xác 100% hạn mức các hũ.
            - **Nút tách 2 giao dịch (Unpair):** Nếu hệ thống tự động ghép nhầm, người dùng chỉ cần bấm nút "Tách 2 giao dịch" trên thẻ chờ duyệt để phân tách lại thành 2 giao dịch độc lập.
            - **Tùy chọn chuyển tiền thủ công:** Cho phép chủ động chọn tài khoản nhận ngay tại màn hình phê duyệt.
          files: |
            qltc-v1.0.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
