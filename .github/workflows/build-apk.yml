name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.2.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "QLTC v1.2.0 - Tối ưu toàn diện UI/UX, Sửa lỗi hũ công trình & Thêm/Sửa thu nhập 1 chạm"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v1.2.0 - Android APK

            Bản nâng cấp lớn `v1.2.0` giải quyết triệt để phản hồi của người dùng và hoàn thiện toàn bộ chuẩn thiết kế V1:
            - **Sửa triệt để lỗi mặc định Hũ Chi tiêu công trình & hiển thị 2 hũ (L-13):** Khắc phục lỗi trùng lặp mã tiền tố jar code; giao diện duyệt chỉ hiển thị 1 hũ sạch sẽ, chính xác.
            - **Thêm và Sửa Khoản thu 1 chạm (U-07):** Nút `+ Thêm khoản thu` nổi bật trực quan ngay trên thẻ Tổng Thu Dự Kiến. Mọi khoản thu đều có thể bấm vào để sửa số tiền, chu kỳ, hoặc xóa ngay lập tức.
            - **Tự động chia đều cho hàng tháng:** Khi chọn chu kỳ hàng quý hoặc hàng năm, hệ thống tự động quy đổi dòng tiền chuẩn hàng tháng để chia hũ chính xác.
            - **Hộp thư giao dịch vuốt chạm mượt mà:** Thao tác vuốt thẻ sang phải để Duyệt, vuốt sang trái để Bỏ qua. Hỗ trợ Hoàn tác 5 giây.
            - **Lịch sử giao dịch thông minh:** Cho phép tìm kiếm, lọc theo loại và bấm vào từng giao dịch đã duyệt để chỉnh sửa hũ hoặc ghi chú.
            - **Ký số chuẩn xác (Fixed Keystore):** Cố định chữ ký số giúp cập nhật trực tiếp mà không bị xung đột gói ứng dụng.
          files: |
            qltc-v1.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
