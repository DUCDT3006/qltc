name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.2.8.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.2.8.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.8
          name: "QLTC v1.2.8 - Chuẩn Hóa Lịch Sử Duyệt Từng Hũ Chi Tiêu & Khử Trùng Khoản Thu/Chuyển Tiền"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v1.2.8 - Android APK

            Phiên bản `v1.2.8` sửa lỗi và tối ưu hóa hiển thị lịch sử duyệt cho các Hũ chi tiêu:
            - **Chuẩn hóa lịch sử chi tiêu từng hũ:** Hũ chi tiêu chỉ ghi nhận và hiển thị các khoản chi thực tế (`expense`) thuộc đúng hũ đó; loại trừ hoàn toàn các khoản tiền vào (thu nhập) và chuyển khoản nội bộ.
            - **Khử trùng dữ liệu DB D1:** Làm sạch các giao dịch thu nhập và chuyển khoản nội bộ cũ để không bị gán nhầm vào hũ Thiết yếu hay Tự do tài chính.
            - **Khớp hũ chính xác tuyệt đối:** Kiểm tra chặt chẽ `jarId` và `jarCode`, đảm bảo mỗi hũ (Thiết yếu, Cho vay, Công trình...) chỉ hiển thị đúng các khoản chi đã duyệt tương ứng.
          files: |
            qltc-v1.2.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
