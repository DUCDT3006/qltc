name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk qltc-v2.0.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v2.0.4.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.4
          name: "QLTC v2.0.4 - Nhận thông báo mua quỹ Fmarket"
          draft: false
          prerelease: false
          body: |
            ## QLTC v2.0.4 cho Android

            - Nhận lệnh mua đã được xác nhận từ app Fmarket vào Chờ duyệt.
            - Chọn tài khoản đã thanh toán trước khi ghi chi đầu tư.
            - Bỏ qua email Fmarket để tránh tạo khoản chờ duyệt trùng.
          files: |
            qltc-v2.0.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
