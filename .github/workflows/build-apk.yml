name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v2.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v2.0.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "QLTC v2.0.0 - Nâng Cấp Toàn Diện Kiến Trúc V2 (Sổ Cái Delta, Phân Bổ VND, XIRR)"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v2.0.0 - Android APK

            Phiên bản `v2.0.0` đánh dấu hoàn tất kiến trúc nâng cấp V2 với 26 cải tiến cốt lõi:
            - **Sổ cái Delta & Chống lặp (V2-02):** Hạch toán delta hai chiều nguyên tử, bảo đảm bất biến tổng số dư và không nhân đôi khi duyệt/undo.
            - **Bộ phân tích thông báo V2 (V2-04):** Xử lý dấu trừ Unicode, bảo vệ ngày tháng không nhầm thành số tiền, loại bỏ hoàn toàn tin nhắn OTP.
            - **Phân bổ VND chính xác (V2-17):** Thuật toán Largest Remainder Method phân phối từng đồng VND không sai lệch.
            - **Bảo vệ tài sản vàng SJC (V2-18):** Tách biệt vàng trong nước SJC không bị ghi đè bởi giá PAXG quốc tế, quy đổi chỉ/lượng/gram chuẩn xác.
            - **Đo lường hiệu quả đầu tư XIRR (V2-19):** Tích hợp công cụ tính tỷ suất sinh lời thực tế nội bộ cho các dòng tiền nạp/rút tài sản.
            - **Chế độ riêng tư (V2-23):** Ẩn hiện số dư nhạy cảm một chạm trên toàn bộ giao diện.
          files: |
            qltc-v2.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
