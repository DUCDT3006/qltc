name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.2.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.2.2.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.2
          name: "QLTC v1.2.2 - Tách bạch Thêm Nguồn Thu & Khoản Thu Tiền Mặt, Sửa Lỗi Lưu Thu/Chi & Chống Trùng Tài Khoản HD"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v1.2.2 - Android APK

            Phiên bản nâng cấp `v1.2.2` hoàn thiện trải nghiệm ghi chép và phân bổ nguồn thu theo đúng yêu cầu thực tế:
            - **Tách bạch 2 tính năng rõ ràng:**
              + **"Thêm nguồn thu"**: Thiết lập Nguồn thu nhập dự kiến (Lương, Thưởng, Cho thuê nhà...) để tự động chia hũ % và làm đích liên kết phân bổ tiền từ các tài khoản ngân hàng / tiền mặt.
              + **"Thêm khoản thu"**: Dùng chuyên biệt để ghi chép Khoản thu thực tế bằng TIỀN MẶT vào Ví, có sẵn lựa chọn phân bổ vào nguồn thu đã tạo và xem tiến độ đạt được.
            - **Khắc phục triệt để lỗi không ấn được nút Lưu:** Bổ sung thông báo kiểm tra dữ liệu trực quan màu đỏ khi thiếu tên hoặc số tiền <= 0 cho cả form Khoản thu, Nguồn thu và Khoản chi; gắn sự kiện click trực tiếp đảm bảo bấm ăn 100% trên mọi dòng điện thoại Android.
            - **Xử lý tài khoản HD Bank và Chống trùng tài khoản:** Gộp tài khoản HD Bank chuẩn mã `HDBank` và số đuôi `9737`, nâng cấp cơ chế nhận diện thông minh theo tên tài khoản người dùng đã đặt, không bao giờ tự ý tạo thêm tài khoản trùng lặp khi nhận thông báo biến động số dư.
          files: |
            qltc-v1.2.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
