name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.0.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.0.4.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: "QLTC v1.0.4 - Cố định chữ ký số (Sửa triệt để xung đột gói) & Tùy biến toàn diện hũ"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v1.0.4 - Android APK

            Bản cập nhật v1.0.4 giải quyết triệt để vấn đề cài đặt và bổ sung các tính năng đột phá:
            - **Cố định chứng chỉ ký số (Permanent Keystore):** Khắc phục hoàn toàn lỗi "xung đột với một gói hiện có" khi cài đè các phiên bản sau này.
            - **Chủ động thêm & xóa hũ:** Người dùng có thể tạo thêm các hũ mới hoặc xóa hũ hiện tại tùy ý.
            - **Tùy biến tỷ lệ % mục tiêu:** Tự do đặt tỷ lệ % chia tiền cho từng hũ (không còn bị cố định).
            - **Lưu trữ hạn mức bền vững:** Khắc phục triệt để lỗi không lưu hạn mức hũ Tiết kiệm, Hưởng thụ, Cho đi lên đám mây D1.
            - **Hiển thị phiên bản v1.0.4 trực tiếp:** Dễ dàng nhận biết bản cập nhật mới trên thanh Navbar.
          files: |
            qltc-v1.0.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
