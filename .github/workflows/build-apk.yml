name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.2.6.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.2.6.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.6
          name: "QLTC v1.2.6 - Quản Lý Nguồn Thu Linh Hoạt, Tự Động Nhận Diện Từ Khóa & Phân Loại Thu Tiền Mặt"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v1.2.6 - Android APK

            Phiên bản `v1.2.6` tối ưu hóa toàn diện tính năng Quản lý Nguồn thu & Phân loại dòng tiền:
            - **Thêm nguồn thu không bắt buộc số tiền dự kiến:** Tạo danh mục nguồn thu theo thực tế (Lương, Thu tiền mặt công trình, Tiền thuê nhà, Thưởng/Hoa hồng, Cổ tức...) mà không cần nhập số tiền dự kiến cố định.
            - **Tự động nhận diện từ khóa ngân hàng:** Thiết lập từ khóa nhận diện cho từng nguồn thu (ví dụ: `luong, cty, cong trinh, thue nha...`). Khi thông báo cộng tiền gửi về, hệ thống tự động nhận diện và gán đúng nguồn thu.
            - **Thêm khoản thu tiền mặt (thực tế) trực quan:** Chọn nguồn thu để phân loại khoản thu tiền mặt bằng thẻ chip 1 chạm hoặc dropdown danh mục, cộng tiền ngay vào ví đã chọn.
            - **Hiển thị nguồn thu đồng bộ ở cả 2 Tab:** Xem rõ ràng tiến độ thực thu của từng nguồn ở cả Tab Kế hoạch và Tab Thu chi thực tế, chạm vào là chỉnh sửa tên, từ khóa hoặc xóa ngay lập tức.
          files: |
            qltc-v1.2.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
