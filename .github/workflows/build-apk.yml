name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.2.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.2.1.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.1
          name: "QLTC v1.2.1 - Bản vá QA chuẩn hóa D1, đồng bộ số dư 2 chiều, bộ lọc kỳ UTC+7 & Cài đặt 4 Tab"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v1.2.1 - Android APK

            Bản vá QA toàn diện `v1.2.1` khắc phục triệt để các lỗi đồng bộ dữ liệu thực tế và nâng cấp độ ổn định sản phẩm:
            - **Đồng bộ D1 & Chuẩn hóa trường dữ liệu:** Sửa lỗi tự động migrate cột DB (`rules`, `income_sources`, `planned_expenses`, `users`), đồng bộ đầy đủ Khoản thu/Chi dự kiến, Hồ sơ cá nhân & giá thị trường lên Cloudflare D1.
            - **Chính xác tuyệt đối Bộ lọc Tháng / Quý / Năm (UTC+7):** Đọc chuẩn thời gian ISO (`occurredAtIso`) thay vì chuỗi hiển thị, đảm bảo mọi giao dịch thực tế đã duyệt đều được cộng chính xác vào Tổng quan & Ngân sách.
            - **Sổ cái Số dư Tài khoản 2 chiều & Ghép cặp Chuyển nội bộ:** Hỗ trợ hoàn tác (Undo 5s) và xóa giao dịch tự động hoàn trả đúng số dư; chuyển khoản nội bộ chỉ hiện 1 thẻ duy nhất chuẩn chiều người gửi → người nhận.
            - **Bảo vệ giá Vàng SJC / BĐS (`autoSync`) & Cài đặt 4 Tab:** Công tắc giữ giá tay không bị giá thế giới ghi đè; hộp thoại Cài đặt phân tách 4 tab gọn gàng (`Cá nhân`, `Ví`, `Tự động`, `Hệ thống`).
          files: |
            qltc-v1.2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
