name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.1.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.1.2.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.2
          name: "QLTC v1.1.2 - Đồng bộ 100% hai chiều các hũ chi tiêu giữa Thu Chi Dự Kiến và Thực Tế"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v1.1.2 - Android APK

            Bản cập nhật `v1.1.2` hoàn thiện tính năng đồng bộ hai chiều cho các hũ chi tiêu:
            - **Đồng bộ hai chiều toàn diện giữa Dự kiến & Thực tế:** Các hũ ở tab Dự kiến và tab Thực tế sử dụng chung danh mục hũ thống nhất.
            - **Thao tác trực tiếp trên cả 2 tab:** Ở cả tab Thực tế lẫn Dự kiến, người dùng đều có thể bấm nút **+ Thêm hũ**, bấm vào thẻ hũ bất kỳ để **Sửa tên, Hạn mức, Màu sắc, Tỷ lệ %** hoặc **Xóa hũ**. Mọi thay đổi ở bên này sẽ tự động cập nhật ngay lập tức sang bên kia và lên trang Tổng quan.
          files: |
            qltc-v1.1.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
