name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.2.9.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.2.9.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.9
          name: "QLTC v1.2.9 - Thống Kê & Lịch Sử Giao Dịch Đã Duyệt Theo Từng Nguồn Thu Thực Tế"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v1.2.9 - Android APK

            Phiên bản `v1.2.9` bổ sung tính năng thống kê và xem chi tiết giao dịch đã duyệt theo từng nguồn thu:
            - **Thống kê theo nguồn thu thực tế:** Bấm vào bất kỳ chip/thẻ nguồn thu nào (hoặc nguồn Thu ngoài dự kiến) tại tab Thu chi thực tế, Kế hoạch hoặc Dashboard để mở modal thống kê chi tiết.
            - **Lịch sử giao dịch đã duyệt:** Xem danh sách đầy đủ tất cả các khoản thu thực tế thuộc về nguồn đó, hỗ trợ lọc theo Tháng này hoặc Tất cả.
            - **So sánh thực tế vs dự kiến:** Tính tổng số tiền thu được, tỷ lệ hoàn thành so với mục tiêu dự kiến (nếu có), số lượng giao dịch và ngày giao dịch gần nhất.
            - **Thao tác nhanh:** Tích hợp nút chỉnh sửa nguồn thu và nút thêm nhanh khoản thu tiền mặt gắn trực tiếp với nguồn thu đang xem.
          files: |
            qltc-v1.2.9.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
