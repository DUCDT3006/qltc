name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.0.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "QLTC v1.0.0 - Bản cài đặt Android"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) - Android APK
            
            Bản cài đặt ứng dụng Android chính thức tích hợp:
            - **Đọc thông báo tự động:** Lắng nghe biến động số dư từ Vietcombank, MB, Techcombank, ACB, TPBank, VPBank... (bảo mật tuyệt đối, tự động loại bỏ mã OTP).
            - **Giao diện Dark Matte Luxury:** Tone màu chuẩn `#657D81`.
            - **Đa nguồn thu & 6 hũ chi tiêu:** Quản lý dòng tiền, đầu tư Cổ phiếu/Quỹ/Crypto/Vàng.
            
            ### 📥 Hướng dẫn cài đặt nhanh:
            1. Bấm vào file **`qltc-v1.0.0.apk`** bên dưới để tải về điện thoại.
            2. Mở file APK vừa tải và chọn **Cài đặt** (Nếu Android hiện cảnh báo ứng dụng ngoài CH Play -> Bấm "Vẫn cài đặt" hoặc "Cho phép cài đặt từ nguồn này").
            3. Mở app QLTC lần đầu:
               - Bấm nút **"1. Bật Quyền Truy Cập Thông Báo"** -> Gạt bật cho **QLTC**.
               - Bấm nút **"2. Tắt Tối Ưu Pin"** -> Chọn Không tối ưu (để app nhận thông báo ngầm liên tục khi tắt màn hình).
               - Bấm **"3. Mở Ứng Dụng"** để bắt đầu sử dụng!
          files: |
            qltc-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
