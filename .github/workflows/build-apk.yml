name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.0.5.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.0.5.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.5
          name: "QLTC v1.0.5 - Tùy chỉnh thông tin cá nhân (Tên, SĐT, Avatar, Gmail) & Chứng chỉ chuẩn"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v1.0.5 - Android APK

            Bản cập nhật v1.0.5 bổ sung các tính năng cá nhân hóa cao cấp:
            - **Hồ sơ thông tin cá nhân:** Cho phép cập nhật Họ tên, Số điện thoại, Gmail và Ảnh đại diện (Avatar). Có thể để mặc định hoặc tùy chỉnh linh hoạt.
            - **Tải ảnh đại diện trực tiếp:** Chọn ảnh từ thiết bị hoặc chọn bộ avatar nhận diện đẹp mắt phong cách Dark Matte.
            - **Chào mừng cá nhân hóa:** Lời chào trên Navbar tự động đồng bộ theo tên thật hoặc biệt danh của người dùng.
            - **Chứng chỉ ký số cố định:** Cài đè trực tiếp mọi bản cập nhật mà không bao giờ bị lỗi xung đột gói.
          files: |
            qltc-v1.0.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
