name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.1.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.1.1.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.1
          name: "QLTC v1.1.1 - Chỉnh sửa khoản thu dự kiến & Tự động chia đều cho hàng tháng theo chu kỳ"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v1.1.1 - Android APK

            Bản cập nhật `v1.1.1` tối ưu tính năng lập kế hoạch Nguồn Thu Dự Kiến:
            - **Chỉnh sửa khoản thu đã tạo:** Cho phép bấm nút Sửa trên từng khoản thu đã tạo để cập nhật tên, số tiền, loại và thời gian nhận thu nhập một cách linh hoạt.
            - **Tùy chọn sẵn thời gian nhận thu nhập:** Bổ sung các chu kỳ chọn sẵn chuẩn mực (Hàng tháng, Hàng quý 3 tháng/lần, Hàng năm 12 tháng/lần, Nửa năm 6 tháng/lần, Hàng tuần).
            - **Tự động chia đều cho hàng tháng:** Khi chọn các chu kỳ ngoài hàng tháng (như Hàng quý, Hàng năm), hệ thống tự động chia đều (chia 3 hoặc chia 12) ra số tiền quy đổi hàng tháng, đảm bảo chia đúng hạn mức các hũ và thống kê đồng nhất theo Tháng, Quý, Năm.
          files: |
            qltc-v1.1.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
