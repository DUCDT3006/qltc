name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.2.7.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.2.7.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.7
          name: "QLTC v1.2.7 - Hỗ Trợ Chuyển Khoản Nội Bộ Hai Chiều Cả Thu Và Chi"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v1.2.7 - Android APK

            Phiên bản `v1.2.7` nâng cấp toàn diện tính năng Chuyển khoản nội bộ giữa các ví/tài khoản:
            - **Hỗ trợ chuyển khoản nội bộ 2 chiều (Cả Thu và Chi):** Khi duyệt giao dịch tiền vào (thu nhập) hoặc tiền ra (chi tiêu), anh đều có thể chọn ghép cặp Chuyển khoản nội bộ ngay lập tức.
            - **Nút "Chuyển nội bộ" trực quan ở cả Thẻ vuốt và Danh sách:** Dễ dàng bấm chuyển nội bộ trực tiếp từ chế độ vuốt thẻ hoặc bấm nút "Nội bộ" ở từng dòng trong danh sách.
            - **Modal chọn ví 2 Tab thông minh:** Tab 1 phân bổ Hũ chi/Nguồn thu và Tab 2 Chuyển khoản nội bộ với đầy đủ thông tin số dư ví, chiều chuyển tiền rõ ràng (ví nguồn ➔ ví đích) và không làm sai lệch hạn mức chi tiêu các hũ.
          files: |
            qltc-v1.2.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
