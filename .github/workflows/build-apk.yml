name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qltc-v1.0.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLTC-Android-APK
          path: qltc-v1.0.1.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "QLTC v1.0.1 - Nâng cấp tự động đọc thông báo Techcombank, HDBank & Tất cả ngân hàng"
          draft: false
          prerelease: false
          body: |
            ## 📱 Ứng dụng Quản lý Tài chính Cá nhân (QLTC) v1.0.1 - Android APK

            Bản cập nhật v1.0.1 khắc phục và nâng cấp toàn diện:
            - **Hỗ trợ trọn vẹn Techcombank & HDBank:** Bóc tách chính xác số tiền dù nằm ở tiêu đề hay nội dung riêng biệt.
            - **Hỗ trợ thêm các app SMS & Ví:** Samsung Messages, Xiaomi SMS, Cake, Timo, MoMo, ZaloPay, Viettel Money.
            - **Loại bỏ tin nhắn/cuộc gọi cá nhân:** Không còn bị nhầm cuộc gọi Zalo hay tin nhắn thường.
            - **Đồng bộ thời gian thực:** Kết nối giao diện trực tiếp với Cloudflare D1 để hiển thị tức thì mọi giao dịch chờ duyệt.
            - **Nhật ký thông báo trực tiếp (Live Logs):** Người dùng có thể tự xem các thông báo app đã bắt được ngay trong Cài đặt.

            ### 📥 Hướng dẫn cài đặt nhanh:
            1. Bấm vào file **`qltc-v1.0.1.apk`** bên dưới để tải về điện thoại.
            2. Mở file APK vừa tải và chọn **Cập nhật** / **Cài đặt**.
            3. Nếu là Android 13/14+ và công tắc bị mờ:
               - Bấm nút **"⭐ Mở cài đặt app"** trên màn hình quyền.
               - Bấm dấu **3 chấm góc phải trên cùng** -> Chọn **"Cho phép cài đặt bị hạn chế"** (Allow restricted settings).
               - Quay lại bật quyền **Truy cập thông báo** và sử dụng!
          files: |
            qltc-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
