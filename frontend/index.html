<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1314" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QLTC" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Quản Lý Tài Chính Cá Nhân</title>
  </head>
  <body class="bg-[#0E1314] text-[#F2F5F5] antialiased selection:bg-[#657D81]/30">
    <div id="root">
      <div style="display:flex;height:100vh;flex-direction:column;align-items:center;justify-content:center;background-color:#0E1314;color:#BFD0D3;font-family:system-ui,-apple-system,sans-serif;gap:12px;">
        <div style="width:32px;height:32px;border:3px solid #232E31;border-top-color:#8CC7AE;border-radius:50%;animation:spin 1s linear infinite;"></div>
        <div style="font-size:13px;letter-spacing:0.5px;">Đang nạp ứng dụng QLTC...</div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.children.length || root.innerHTML.indexOf('Đang nạp') !== -1)) {
          root.innerHTML = '<div style="display:flex;height:100vh;flex-direction:column;align-items:center;justify-content:center;background-color:#0E1314;color:#F2F5F5;font-family:sans-serif;padding:20px;text-align:center;"><p style="color:#E06D6D;font-weight:bold;margin-bottom:8px;">Không thể tải giao diện</p><p style="color:#869699;font-size:12px;margin-bottom:16px;">' + (e.message || 'Lỗi nạp script') + '</p><button onclick="location.reload()" style="padding:10px 20px;border-radius:12px;background:#8CC7AE;color:#0E1314;font-weight:bold;border:none;">Tải lại trang</button></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
