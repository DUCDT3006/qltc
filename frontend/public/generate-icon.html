<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; background: transparent; display: flex; align-items: center; justify-content: center; width: 512px; height: 512px; }
.icon {
  width: 512px; height: 512px;
  background: linear-gradient(135deg, #1C2426 0%, #0E1314 100%);
  border-radius: 115px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  border: 8px solid #2C383B;
  box-sizing: border-box;
}
.symbol {
  width: 230px; height: 230px;
}
.text {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-weight: 800; font-size: 64px;
  color: #F2F5F5;
  letter-spacing: 4px;
  margin-top: 10px;
}
</style>
</head>
<body>
<div class="icon">
  <svg class="symbol" viewBox="0 0 100 100" fill="none">
    <circle cx="50" cy="50" r="42" stroke="#657D81" stroke-width="8" stroke-dasharray="190 70" />
    <path d="M30 65 L45 42 L60 52 L78 28" stroke="#95B0B4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="78" cy="28" r="6" fill="#F2F5F5" />
    <path d="M42 62 L50 48 L58 62 Z" fill="#657D81" opacity="0.6"/>
  </svg>
  <div class="text">QLTC</div>
</div>
</body>
</html>
